name: LSL.Net

on:
  push:
    branches: '*'
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macOS-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x

      - name: List installed .NET SDKs
        run: dotnet --list-sdks

      - name: Build and package
        run: dotnet pack -c Release src/LSL.Net.slnf

      - name: Build examples
        run: dotnet build -c Release examples/LSLExamples/LSLExamples.csproj

#     - name: Run examples
#       run: dotnet run -p examples/LSLExamples/LSLExamples.csproj

      - name: Upload build artifacts
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: "**/*.*nupkg"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages

      - name: Push NuGet packages
        run: |
          dotnet nuget push **/*.nupkg --skip-duplicate --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      - name: Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          generate_release_notes: true
          files: |
            **/*.nupkg
            **/*.snupkg
